server {
    listen 80 default_server;
    listen 443 ssl default_server;

    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    client_max_body_size 10M;

    # --- /api -> backend ---
    location /api/ {
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;

        proxy_pass http://backend:8080/api/;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"error":"backend unavailable"}';
    }

    # --- /storage -> obs ---
    location /storage/ {
        proxy_intercept_errors on;
        error_page 502 503 504 = @obs_down;

        proxy_pass http://service-obs:8333/storage/;
    }

    location @obs_down {
        default_type application/json;
        return 503 '{"error":"storage unavailable"}';
    }

    # --- Корень -> frontend (статика) ---
    location / {
        proxy_intercept_errors on;
        error_page 502 503 504 = /maintenance.html;

        proxy_pass http://frontend:80;
    }

    # --- Заглушка о техническом обслуживании ---
    location = /maintenance.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }
}
