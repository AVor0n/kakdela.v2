name: CI
on:
  pull_request:
  workflow_dispatch:
jobs:
  backend-verification:
    name: Run Maven verify phase (tests are temporary excluded)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run Maven verify phase
        run: ./mvnw verify -Dmaven.test.skip=true
        working-directory: backend
      - name: Do Checkstyle report with Reviewdog
        run: >
          reviewdog
          -f=checkstyle
          -reporter=github-pr-review
          -fail-level=any
          -diff="git diff origin/${{ github.base_ref }}"
          < backend/target/checkstyle-result.xml
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
