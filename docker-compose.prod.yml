services:
  backend:
    image: kakdelav2/kakdela.v2:backend-latest
    container_name: kd2-backend
    ports:
      - "8080:8080"
    depends_on:
      service-db:
        condition: service_healthy
      service-obs:
        condition: service_started
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/monitor/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: kakdelav2/kakdela.v2:frontend-latest
    container_name: kd2-frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

  service-db:
    image: postgres:14.7-alpine
    container_name: kd2-postgres
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  service-obs:
    image: chrislusf/seaweedfs:latest
    container_name: kd2-seaweedfs
    env_file:
      - .env
    expose:
      - "8333"
      - "9333"
    volumes:
      - obs-data:/data
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -s3

  nginx:
    image: kakdelav2/kakdela.v2:nginx-latest
    container_name: kd2-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/kakdela.v2/ssl:/etc/nginx/ssl:ro
    depends_on:
      service-db:
        condition: service_healthy
      service-obs:
        condition: service_started
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  obs-data:
